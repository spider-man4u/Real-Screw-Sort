name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - run: flutter pub get
      - name: Auto-fix style lints (trailing commas, const)
        run: dart fix --apply || true
      - name: Analyze (capture output)
        run: mkdir -p build && (flutter analyze --no-fatal-infos || true) 2>&1 | tee build/analyze.txt
      - name: Test (capture output)
        run: (flutter test; test $? -eq 0) 2>&1 | tee build/test_output.txt; exit ${PIPESTATUS[0]}
      - name: Upload physics debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-debug-output
          path: |
            build/*.txt

  android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate android platform
        run: flutter create --platforms=android --project-name real_screw_sort --org com.realscrewsort .
      - name: Remove generated widget test (kept from template)
        run: rm -f test/widget_test.dart
      - name: Patch signing config
        run: python3 tools/patch_build_gradle.py android/app/build.gradle
      - name: Write keystore from secret
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  web:
    name: Build & deploy web (Pages)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate web platform
        run: flutter create --platforms=web --project-name real_screw_sort --org com.realscrewsort .
      - name: Remove generated widget test (kept from template)
        run: rm -f test/widget_test.dart
      - run: flutter build web --release --base-href /Real-Screw-Sort/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
